 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RLCMS Login</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <img src="../image/logo.png"
             class="login-logo"
             alt="Logo">

        <h1>RLCMS</h1>

        <p>Rohingya Language Centre Management System</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</div>

<script src="admin.js"></script>

</body>

</html>
