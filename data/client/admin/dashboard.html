 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dictionary Editor</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="editor">

        <h1>Dictionary Editor</h1>

        <div class="tabs">

            <button class="tab active">
                General
            </button>

            <button class="tab">
                Meanings
            </button>

            <button class="tab">
                Relationships
            </button>

            <button class="tab">
                Media
            </button>

            <button class="tab">
                History
            </button>

        </div>


        <div class="tab-content">

            <h2>General Information</h2>


            <!-- English Word -->

            <label for="englishWord">
                English Word
            </label>

            <input
                type="text"
                id="englishWord"
                placeholder="Enter English word"
            >


            <!-- Part of Speech -->

            <label for="partOfSpeech">
                Part of Speech
            </label>

            <select id="partOfSpeech">

                <option value="">
                    Select part of speech
                </option>

                <option value="noun">
                    Noun
                </option>

                <option value="verb">
                    Verb
                </option>

                <option value="adjective">
                    Adjective
                </option>

                <option value="adverb">
                    Adverb
                </option>

                <option value="pronoun">
                    Pronoun
                </option>

                <option value="preposition">
                    Preposition
                </option>

                <option value="conjunction">
                    Conjunction
                </option>

                <option value="interjection">
                    Interjection
                </option>

                <option value="phrase">
                    Phrase
                </option>

                <option value="idiom">
                    Idiom
                </option>

                <option value="abbreviation">
                    Abbreviation
                </option>

                <option value="other">
                    Other
                </option>

            </select>


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <select id="category">

                <option value="">
                    Select category
                </option>

                <option value="1">
                    Food
                </option>

                <option value="2">
                    Animals
                </option>

                <option value="3">
                    Education
                </option>

                <option value="4">
                    Health
                </option>

                <option value="5">
                    Science
                </option>

                <option value="6">
                    Religion
                </option>

            </select>


            <!-- Status -->

            <label for="status">
                Status
            </label>

            <select id="status">

                <option value="draft">
                    Draft
                </option>

                <option value="pending_review">
                    Pending Review
                </option>

                <option value="published">
                    Published
                </option>

                <option value="archived">
                    Archived
                </option>

            </select>


            <!-- Save -->

            <button id="saveGeneral">
                Save General Information
            </button>

        </div>

    </div>


    <script src="admin.js"></script>

</body>

</html>
